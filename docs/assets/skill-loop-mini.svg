<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="The skill loop, small: runs logged, repeats grouped, ekip skill learn, you accept, .claude/skills, every brief; lessons go on top of every brief and the lead.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#0B0D11"/></linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".32"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".045"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5EEAD4"/></marker>
  </defs>
  <style>.t{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-weight:700;fill:#F3F4F6}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>
  <rect width="1200" height="750" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="750" rx="28" fill="url(#dots)"/>
  <circle cx="600" cy="336" r="170" fill="url(#core)"/>
  <circle cx="600" cy="336" r="118" fill="none" stroke="#2DD4BF" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="600" cy="336" r="84" fill="#10302B" stroke="#5EEAD4" stroke-width="3"/>
  <g class="t" text-anchor="middle"><text x="600" y="340" class="h" font-size="36">skills</text><text x="600" y="374" fill="#CCFBF1" font-size="22">per project</text></g>
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <linearGradient id="w0" gradientUnits="userSpaceOnUse" x1="562" y1="125" x2="630" y2="125"><stop offset="0" stop-color="#F07B3F"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <path d="M562.0 125.0 A396 212 0 0 1 629.7 124.6" stroke="url(#w0)" marker-end="url(#arr)"/>
    <linearGradient id="w1" gradientUnits="userSpaceOnUse" x1="906" y1="201" x2="981" y2="279"><stop offset="0" stop-color="#F07B3F"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <path d="M906.0 201.4 A396 212 0 0 1 981.4 279.0" stroke="url(#w1)" marker-end="url(#arr)"/>
    <linearGradient id="w2" gradientUnits="userSpaceOnUse" x1="985" y1="385" x2="918" y2="462"><stop offset="0" stop-color="#F07B3F"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <path d="M985.2 385.1 A396 212 0 0 1 917.9 462.4" stroke="url(#w2)" marker-end="url(#arr)"/>
    <linearGradient id="w3" gradientUnits="userSpaceOnUse" x1="638" y1="547" x2="570" y2="547"><stop offset="0" stop-color="#F07B3F"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <path d="M638.0 547.0 A396 212 0 0 1 570.3 547.4" stroke="url(#w3)" marker-end="url(#arr)"/>
    <linearGradient id="w4" gradientUnits="userSpaceOnUse" x1="294" y1="471" x2="219" y2="393"><stop offset="0" stop-color="#F07B3F"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <path d="M294.0 470.6 A396 212 0 0 1 218.6 393.0" stroke="url(#w4)" marker-end="url(#arr)"/>
    <linearGradient id="w5" gradientUnits="userSpaceOnUse" x1="215" y1="287" x2="282" y2="210"><stop offset="0" stop-color="#F07B3F"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <path d="M214.8 286.9 A396 212 0 0 1 282.1 209.6" stroke="url(#w5)" marker-end="url(#arr)"/>
  </g>
  <g class="t" text-anchor="middle">
    <rect x="252" y="113" width="300" height="78" rx="20" fill="#0F2A27" stroke="#1F5D55" stroke-width="2"/><text x="402" y="162" class="h" font-size="30">runs logged</text>
    <rect x="648" y="113" width="300" height="78" rx="20" fill="#0F2A27" stroke="#1F5D55" stroke-width="2"/><text x="798" y="162" class="h" font-size="30">repeats grouped</text>
    <rect x="846" y="297" width="300" height="78" rx="20" fill="#0F2A27" stroke="#1F5D55" stroke-width="2"/><text x="996" y="346" class="m" font-size="28" font-weight="700" fill="#CCFBF1">skill learn</text>
    <rect x="648" y="481" width="300" height="78" rx="20" fill="#1E222B" stroke="#E5E7EB" stroke-opacity=".75" stroke-width="2.5"/><text x="798" y="530" class="h" font-size="30" fill="#FFFFFF">you accept</text>
    <rect x="252" y="481" width="300" height="78" rx="20" fill="#0F2A27" stroke="#1F5D55" stroke-width="2"/><text x="402" y="530" class="m" font-size="28" font-weight="700" fill="#CCFBF1">.claude/skills</text>
    <rect x="54" y="297" width="300" height="78" rx="20" fill="#0F2A27" stroke="#1F5D55" stroke-width="2"/><text x="204" y="346" class="h" font-size="30">every brief</text>
  </g>
  <g class="t">
    <rect x="48" y="636" width="1104" height="74" rx="20" fill="#151A22" stroke="#2A303B" stroke-width="2"/>
    <text x="600" y="683" text-anchor="middle" font-size="26" fill="#98A1B0">lessons go on top of every <tspan fill="#CCFBF1">worker brief</tspan> and <tspan fill="#FFC58A">the lead</tspan></text>
  </g>
</svg>
