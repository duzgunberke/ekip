<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="How ekip works: you talk to one Claude lead, which plans and reviews; agents on other quotas do the work, each starting from the project's memory.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#0B0D11"/></linearGradient>
    <linearGradient id="lead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB45C"/><stop offset="1" stop-color="#F07B3F"/></linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F07B3F"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".045"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5EEAD4"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#FFA95E"/></marker>
  </defs>
  <style>
    .t{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .h{font-weight:700;fill:#F3F4F6}.s{fill:#98A1B0}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}
  </style>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="24" fill="url(#dots)"/>

  <!-- you -->
  <g class="t">
    <rect x="40" y="196" width="170" height="104" rx="16" fill="#1A1E27" stroke="#2A303B"/>
    <text x="125" y="240" text-anchor="middle" class="h" font-size="22">You</text>
    <text x="125" y="268" text-anchor="middle" class="s" font-size="14">one terminal</text>
  </g>
  <path d="M214 248 H300" stroke="#FFA95E" stroke-width="3" marker-end="url(#arrA)"/>

  <!-- lead -->
  <g class="t">
    <rect x="304" y="168" width="250" height="160" rx="20" fill="#24180F" stroke="url(#lead)" stroke-width="2"/>
    <path d="M330 198 344 212 330 226" fill="none" stroke="url(#lead)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="356" y="220" class="h" font-size="22">Lead · Claude</text>
    <text x="330" y="258" class="s" font-size="15">understands, splits, routes</text>
    <text x="330" y="282" class="s" font-size="15">reviews diffs and tests</text>
    <text x="330" y="310" font-size="13" fill="#FFA95E" class="t">your subscription, judgment only</text>
  </g>

  <!-- wires to workers -->
  <g fill="none" stroke="url(#wire)" stroke-width="3" marker-end="url(#arr)">
    <path d="M556 220 C620 220 630 92 708 92"/>
    <path d="M556 238 C628 238 636 188 708 188"/>
    <path d="M556 258 C628 258 636 284 708 284"/>
    <path d="M556 276 C620 276 630 380 708 380"/>
  </g>

  <!-- workers -->
  <g class="t">
    <rect x="712" y="56" width="300" height="72" rx="14" fill="#0F2A27" stroke="#1F5D55"/>
    <circle cx="742" cy="92" r="8" fill="#5EEAD4"/><text x="762" y="88" class="h" font-size="19">Antigravity</text><text x="762" y="110" class="s" font-size="13">long autonomous runs · Google quota</text>
    <rect x="712" y="152" width="300" height="72" rx="14" fill="#0F2A27" stroke="#1F5D55"/>
    <circle cx="742" cy="188" r="8" fill="#5EEAD4"/><text x="762" y="184" class="h" font-size="19">Codex</text><text x="762" y="206" class="s" font-size="13">coding agent · ChatGPT plan</text>
    <rect x="712" y="248" width="300" height="72" rx="14" fill="#0F2A27" stroke="#1F5D55"/>
    <circle cx="742" cy="284" r="8" fill="#5EEAD4"/><text x="762" y="280" class="h" font-size="19">Copilot</text><text x="762" y="302" class="s" font-size="13">coding agent · Copilot plan</text>
    <rect x="712" y="344" width="300" height="72" rx="14" fill="#0F2A27" stroke="#1F5D55"/>
    <circle cx="742" cy="380" r="8" fill="#5EEAD4"/><text x="762" y="376" class="h" font-size="19">Free pool</text><text x="762" y="398" class="s" font-size="13">~60 free models · auto failover</text>
  </g>
  <text x="1046" y="236" class="t s" font-size="14" transform="rotate(90 1046 236)" text-anchor="middle">other quotas · not your Claude limit</text>

  <!-- memory band -->
  <g class="t">
    <rect x="304" y="452" width="708" height="76" rx="16" fill="#151A22" stroke="#2A303B"/>
    <text x="330" y="484" class="h" font-size="17">Project memory</text>
    <text x="330" y="508" class="s" font-size="14">workers start here, not from zero</text>
    <g font-size="14" class="m">
      <rect x="640" y="472" width="78" height="36" rx="9" fill="#10302B"/><text x="679" y="495" text-anchor="middle" fill="#CCFBF1">facts</text>
      <rect x="728" y="472" width="70" height="36" rx="9" fill="#10302B"/><text x="763" y="495" text-anchor="middle" fill="#CCFBF1">wiki</text>
      <rect x="808" y="472" width="104" height="36" rx="9" fill="#10302B"/><text x="860" y="495" text-anchor="middle" fill="#CCFBF1">code graph</text>
      <rect x="922" y="472" width="74" height="36" rx="9" fill="#10302B"/><text x="959" y="495" text-anchor="middle" fill="#CCFBF1">skills</text>
    </g>
  </g>
  <path d="M860 450 V420" stroke="#2DD4BF" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M430 450 V332" stroke="#FFA95E" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- hub -->
  <g class="t">
    <rect x="40" y="452" width="230" height="76" rx="16" fill="#151A22" stroke="#2A303B"/>
    <text x="64" y="484" class="h" font-size="17">Hub (optional VPS)</text>
    <text x="64" y="508" class="s" font-size="14">memory, free pool, queue, panel</text>
  </g>
  <path d="M272 490 H300" stroke="#98A1B0" stroke-width="2" stroke-dasharray="4 5"/>
</svg>
